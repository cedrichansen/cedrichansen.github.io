  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/profilepic.jpg"
    content: |-

      I am a software developer with a passion for designing server side software that is fault tolerant, and _fast_.
 
      I am currently working as a software developer at [Square](https://squareup.com).

      At Square, I am part of the Risk Engineering team - focused on ensuring that bad actors are preventing from causing harm, and good actors are met with a frictionless risk experience to get seamless access to the products that help them run their business.

      I am currently working on a project that is centered around increasing the fault tolerance of payment review and approval systems.
    


    skills:
      enable: true
      title: "Here are a few technologies I enjoy using"
      items:
        - Java
        - Guice
        - Bazel
        - Github
        - Bash
        - Apache Kafka
        - Golang
        - Dart/Flutter
        - SQL
        - C/C++
        - AWS (SQS, S3, DynamoDB)


  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - job: "Senior Software Developer"
        company: "Square"
        companyUrl: "https://squareup.com"
        date: "October 2021 - present"
        # featuredLink:
        #   enable: true
        #   name: "View the project"
        #   url: "https://example.com"
        content: |
          I have been working with the Risk team since joining Square. My main focus has been creating automated solutions to minimize risk loss, while providing a pleasant experience to good sellers inadvertently caught up in risk controls.
          This involves design, and implementation, as well as lots of collaboration with other engineers, data scientists, and Product Managers.
          
          A few projects that I am particularly proud of:
          - Designing, and implementing risk controls for Unlinked refunds for both [API](https://developer.squareup.com/docs/refunds-api/unlinked-refunds) and [retail](https://squareup.com/help/ca/en/article/6350-process-a-return-or-exchange-with-square-for-retail)
          - Integrated various third party vendors into payment onboarding process, leading to a reduction in over $10 Million in Risk losses.
          - Restructured payment activation risk controls, leading to a 70% decrease in latency (4s p99 -> 1.6s p99)
          - Restructured payments risk review flow, to allow continued remediation of payments, even during outages
          - Created Third Party data framework to signalize feature data into ML platform, reducing integration time for new data sources by ~20%.
          
 
      - job: "Software Developer"
        company: "IBM"
        companyUrl: "https://www.ibm.com"
        date: "May 2019 - October 2021"
        featuredLink:
          enable: true
          url: "https://blog.openj9.org/2021/09/24/balanced-gc-performance-improvements-eden-heap-sizing-improvements/"
        # info:
        #   enable: true
        #   content: "".
        content: |
          I worked at IBM, on the Runtime Technologies team, working on the Garbage Collection component of [OpenJ9](https://github.com/eclipse-openj9/openj9), a JVM effort primarily led by IBM, with a focus on small memory footprint and fast startup. 
          This role was an incredible opportunity to learn the in's and outs of the JVM, from industry leaders.
          
          During my time at IBM, I worked on a few features to improve the performance of various GC components, including:
          - Improved Balanced GC policy to reduce total GC pauses by up to 300%, by [dynamically adjusting eden size](https://blog.openj9.org/2021/09/24/balanced-gc-performance-improvements-eden-heap-sizing-improvements/), after [extensive performance testing](https://github.com/eclipse-openj9/openj9/issues/10721).
          - Introduced the [target pause time](https://www.eclipse.org/openj9/docs/xgc/#targetpausetime) feature for Balanced GC policy, which allows this GC to have a soft pause time target (`-Xgc:targetPausetime`).
          - Open sourced, and added to [Synthetic GC Workload](https://blog.openj9.org/2019/09/04/openj9-internship-gc-performance-and-testing/) ([git](https://github.com/adoptium/aqa-tests/tree/master/functional/SyntheticGCWorkload#a-multi-threaded-tunable-synthetic-gc-workload)) test framework.
          - Resolved several user raised [issues](https://github.com/eclipse-openj9/openj9/issues?q=is%3Aissue+is%3Aclosed).

      - job: "Software Engineer"
        company: "Routemate"
        companyUrl: "https://www.ext.tech/"
        date: "December 2019 - October 2021"
        # featuredLink:
        #   enable: true
        #   url: "https://example.com"
        content: |
          Routemate was a web application that I was commissioned to build for [Hansen Lawn&Gardens](https://www.greensideup.com/).
          This application facilitated the creation, distribution, and optimization of routes, along with a notification system to alert clients when their properties had been visited. 
          The application also had a forms feature, which enabled the creation, and completion of custom forms. 

          This application was used by ~40 users for 4 years, and helped [Hansen Lawn&Gardens](https://www.greensideup.com/) operate efficiently throughout COVID-19 pandemic.

          The software owned by [Hansen Lawn&Gardens](https://www.greensideup.com/), was eventually spun off into [EXT.tech](https://www.ext.tech/) in 2023, which built off of Routemates success. 

          Some sample videos of Routemate are included in the [Projects](#projects) section

      - job: "Automation Engineer"
        company: "Novelis"
        companyUrl: "https://novelis.com"
        date: "May 2018 - December 2018"
        # featuredLink:
        #   enable: true
        #   url: "https://example.com"
        content: |
          I worked as an Automation Engineering intern at Novelis, one of the largest alluminium manufacturing companies in the world.

          - Developed a plant wide QR system for maintenance forms, including daily report dashboards, which reduced time taken to process forms by 50%.
          - Independently created an application to generate QR codes for future forms.

